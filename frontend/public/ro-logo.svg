<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" width="100%" height="100%" fill="none">
  <defs>
    <!-- Silver Metallic Gradient for Barbell & Plates -->
    <linearGradient id="silverPlatesGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#E2E8F0" />
      <stop offset="70%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <!-- Top Ring Arc (White / Silver Metallic) -->
    <linearGradient id="ringTopWhite" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CBD5E1" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Bottom Ring Arc (Dynamic Red Gradient) -->
    <linearGradient id="ringBottomRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3838" />
      <stop offset="50%" stop-color="#E00613" />
      <stop offset="100%" stop-color="#9E000C" />
    </linearGradient>

    <!-- White Letter 'O' Gradient (Underneath) -->
    <linearGradient id="oWhiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#9AA9BD" />
    </linearGradient>

    <!-- Red Letter 'R' Gradient (On Top) -->
    <linearGradient id="rRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5252" />
      <stop offset="40%" stop-color="#FF1E1E" />
      <stop offset="100%" stop-color="#B80000" />
    </linearGradient>

    <filter id="subtleGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <!-- 3D Shadow for 'R' when overlapping 'O' -->
    <filter id="rOverlapShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="4" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.85" />
    </filter>
  </defs>

  <!-- ================= 1. CIRCULAR RING ARCS ================= -->
  <g filter="url(#subtleGlow)">
    <!-- Top Arc (Metallic White) -->
    <path
      d="M 148 140 C 154 84 204 42 270 42 C 336 42 386 84 392 140 L 364 140 C 358 98 318 68 270 68 C 222 68 182 98 176 140 Z"
      fill="url(#ringTopWhite)"
    />

    <!-- Bottom Arc (Vibrant Red) -->
    <path
      d="M 148 180 C 154 236 204 278 270 278 C 336 278 386 236 392 180 L 364 180 C 358 222 318 252 270 252 C 222 252 182 222 176 180 Z"
      fill="url(#ringBottomRed)"
    />
  </g>

  <!-- ================= 2. BARBELL PLATES & SLEEVES ================= -->
  <g filter="url(#subtleGlow)" fill="url(#silverPlatesGrad)">
    <!-- LEFT SIDE WEIGHT PLATES -->
    <!-- Bar Tip -->
    <rect x="54" y="152" width="18" height="16" rx="2" />
    <!-- Plate 1 (Outer small) -->
    <polygon points="74,132 82,132 82,188 74,188" />
    <!-- Plate 2 (Medium) -->
    <polygon points="86,116 98,116 98,204 86,204" />
    <!-- Plate 3 (Large) -->
    <polygon points="102,100 116,100 116,220 102,220" />
    <!-- Plate 4 (Inner Largest Collar) -->
    <polygon points="120,90 136,90 136,230 120,230" />
    <!-- Bar connector shaft entering center -->
    <rect x="136" y="150" width="22" height="20" />
    <polygon points="152,138 160,138 160,182 152,182" />

    <!-- RIGHT SIDE WEIGHT PLATES -->
    <!-- Bar connector shaft entering center -->
    <rect x="382" y="150" width="22" height="20" />
    <polygon points="380,138 388,138 388,182 380,182" />
    <!-- Plate 4 (Inner Largest Collar) -->
    <polygon points="404,90 420,90 420,230 404,230" />
    <!-- Plate 3 (Large) -->
    <polygon points="424,100 438,100 438,220 424,220" />
    <!-- Plate 2 (Medium) -->
    <polygon points="442,116 454,116 454,204 442,204" />
    <!-- Plate 1 (Outer small) -->
    <polygon points="458,132 466,132 466,188 458,188" />
    <!-- Bar Tip -->
    <rect x="468" y="152" width="18" height="16" rx="2" />
  </g>

  <!-- ================= 3. ATHLETIC MONOGRAM (O NICHE / UNDERNEATH, R UPR / ON TOP) ================= -->
  <!-- FIRST: LETTER 'O' in Crisp White/Silver (Rendered below R) -->
  <g filter="url(#subtleGlow)">
    <path
      fill-rule="evenodd"
      clip-rule="evenodd"
      d="M 298 92 L 354 92 C 380 92 394 108 388 140 L 374 180 C 367 212 346 228 318 228 L 262 228 C 236 228 222 212 228 180 L 242 140 C 249 108 270 92 298 92 Z M 300 118 C 286 118 278 126 274 142 L 262 178 C 258 194 264 202 278 202 L 314 202 C 328 202 336 194 340 178 L 352 142 C 356 126 350 118 336 118 L 300 118 Z"
      fill="url(#oWhiteGrad)"
    />
    <polygon points="298,92 312,92 276,228 262,228" fill="#FFFFFF" opacity="0.4" />
  </g>

  <!-- SECOND: LETTER 'R' in Dynamic Red (Rendered on top of O with 3D overlap shadow) -->
  <g filter="url(#rOverlapShadow)">
    <path
      fill-rule="evenodd"
      clip-rule="evenodd"
      d="M 194 92 L 264 92 C 286 92 298 104 294 130 C 290 152 274 163 252 165 L 274 228 L 238 228 L 220 174 L 206 174 L 188 228 L 156 228 L 194 92 Z M 218 116 L 207 150 L 246 150 C 255 150 262 145 264 134 C 265 124 259 116 248 116 L 218 116 Z"
      fill="url(#rRedGrad)"
    />
    <!-- Sharp Bevel Highlights on 'R' -->
    <polygon points="194,92 208,92 170,228 156,228" fill="#FFFFFF" opacity="0.35" />
  </g>
</svg>
